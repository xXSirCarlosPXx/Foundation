name: Build and Release ChatControl with GraalVM 24

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout ChatControl
      uses: actions/checkout@v4

    - name: Setup GraalVM 24
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '24'
        distribution: 'graalvm'  # Configura GraalVM como JDK
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout Foundation
      uses: actions/checkout@v4
      with:
        repository: 'tu-org/foundation'
        path: 'foundation'

    - name: Build Foundation
      run: |
        cd foundation
        mvn clean install -DskipTests

    - name: Build ChatControl
      run: mvn clean package -DskipTests

    - name: Upload JAR artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chatcontrol-jars
        path: '**/target/*.jar'

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: '**/target/*.jar'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
